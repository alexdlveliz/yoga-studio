[build]
  command = "pnpm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "10.12.4"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["src/views/**", "src/public/**"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app/:splat"
  status = 200
